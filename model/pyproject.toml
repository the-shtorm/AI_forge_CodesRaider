[project]
name = "smart-search-model"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
docs = ["pyyaml>=6,<7"]
test = ["httpx>=0.28,<1"]
ml = [
    "sentence-transformers==5.1.2",
    "torch==2.9.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
