  /v1/explain:
    post:
      tags:
      - Поиск
      summary: Explain Card
      description: Вернуть пояснение по сохранённым фактам конкретной показанной карточки.
      operationId: explainCard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        default:
          description: Другие ошибки используют тот же формат Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Справочный стенд
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONTRACT_ONLY:
                  value:
                    type: about:blank
                    title: Справочный стенд
                    status: 501
                    detail: Формат запроса принят. Обработчик реализуется в Spring Boot.
                    code: CONTRACT_ONLY
        '400':
          description: Ошибка входных данных
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: about:blank
                    title: Ошибка входных данных
                    status: 400
                    detail: Проверьте типы полей и ограничения запроса.
                    code: INVALID_REQUEST
        '404':
          description: Карточка отсутствует в этой выдаче
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/suggest:
    get:
      tags:
      - Поиск
      summary: Дополнить поисковую строку
      description: 'Выбор мышью или Enter передаёт kind и target_id в selected_target обычного поиска.

        Клиент сохраняет исходный q. Вызов подсказок не создаёт отправленный поиск.'
      operationId: suggestTargets
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: \S
          description: Непустой префикс, например EP2-0.
          title: Q
        description: Непустой префикс, например EP2-0.
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: Ограничить подсказки текущим разделом.
          title: Category Id
        description: Ограничить подсказки текущим разделом.
      - name: profile_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: hardware_buyer — закупщик оборудования, software_admin — администратор ПО. Без известного
            профиля используется обычный порядок.
          title: Profile Id
        description: hardware_buyer — закупщик оборудования, software_admin — администратор ПО. Без известного профиля
          используется обычный порядок.
      responses:
        '200':
          description: До шести подсказок, пустой массив при отсутствии вариантов.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suggestion'
                maxItems: 6
                title: Response Suggesttargets
              examples:
                offer:
                  summary: Префикс EP2-0
                  value:
                  - kind: offer
                    target_id: '473582'
                    label: Microsoft Office 2024 · EP2-06605
                backup:
                  summary: Префикс кибер бэ
                  value:
                  - kind: collection
                    target_id: cyberprotect-1033
                    label: Кибер Бэкап
        default:
          description: Другие ошибки используют тот же формат Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Справочный стенд
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONTRACT_ONLY:
                  value:
                    type: about:blank
                    title: Справочный стенд
                    status: 501
                    detail: Формат запроса принят. Обработчик реализуется в Spring Boot.
                    code: CONTRACT_ONLY
        '400':
          description: Ошибка входных данных
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: about:blank
                    title: Ошибка входных данных
                    status: 400
                    detail: Проверьте типы полей и ограничения запроса.
                    code: INVALID_REQUEST
        '503':
          description: Каталог недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CATALOG_UNAVAILABLE:
                  value:
                    type: about:blank
                    title: Каталог недоступен
                    status: 503
                    detail: Активный снимок каталога ещё не опубликован.
                    code: CATALOG_UNAVAILABLE
  /v1/entities/{kind}/{id}:
    get:
      tags:
      - Каталог
      summary: Открыть сущность каталога
      description: 'Повторно применяет фильтры поиска, переданные отдельными query-параметрами.

        Известная сущность с пустым списком удовлетворяющих фильтрам вариантов даёт 200.'
      operationId: getEntity
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          enum:
          - offer
          - family
          - vendor
          - category
          - collection
          type: string
          title: Kind
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: \S
          description: Строковый ID сущности выбранного kind.
          title: Id
        description: Строковый ID сущности выбранного kind.
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: Обязательный раздел каталога.
          title: Category Id
        description: Обязательный раздел каталога.
      - name: vendor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: Ключ вендора из каталога.
          title: Vendor Id
        description: Ключ вендора из каталога.
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: Требуемая ОС или платформа.
          title: Platform
        description: Требуемая ОС или платформа.
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: Версия продукта как строка, например 5.0.
          title: Version
        description: Версия продукта как строка, например 5.0.
      - name: license_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - new
            - renewal
            - upgrade
            type: string
          - type: 'null'
          description: Покупка новой лицензии, продление или обновление.
          title: License Type
        description: Покупка новой лицензии, продление или обновление.
      - name: term_months
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Срок лицензии в месяцах.
          title: Term Months
        description: Срок лицензии в месяцах.
      - name: device_count
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Сколько устройств должна покрывать лицензия.
          title: Device Count
