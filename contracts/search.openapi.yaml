          type: string
          minLength: 1
          pattern: \S
          title: Event Id
          description: Стабильный ключ идемпотентности. При повторной доставке сохранить тот же ID.
        session_id:
          type: string
          minLength: 1
          pattern: \S
          title: Session Id
        ts:
          type: string
          format: date-time
          title: Ts
          description: RFC 3339 со смещением времени.
        source:
          type: string
          enum:
          - demo
          - seed
          title: Source
          description: demo — действия на стенде, seed — подготовленные синтетические события.
          default: demo
        type:
          type: string
          const: reformulation
          title: Type
        search_id:
          type: string
          minLength: 1
          pattern: \S
          title: Search Id
          description: Предыдущий отправленный поиск.
        next_search_id:
          type: string
          minLength: 1
          pattern: \S
          title: Next Search Id
          description: Поиск после переформулировки.
      additionalProperties: false
      type: object
      required:
      - event_id
      - session_id
      - ts
      - type
      - search_id
      - next_search_id
      title: Reformulation
    SearchFacet:
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          title: Id
        label:
          type: string
          minLength: 1
          pattern: \S
          title: Label
        count:
          type: integer
          minimum: 0.0
          title: Count
          description: Число подходящих прямых семейств.
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - count
      title: SearchFacet
    SearchFacets:
      properties:
        vendors:
          items:
            $ref: '#/components/schemas/SearchFacet'
          type: array
          title: Vendors
        categories:
          items:
            $ref: '#/components/schemas/SearchFacet'
          type: array
          title: Categories
      additionalProperties: false
      type: object
      required:
      - vendors
      - categories
      title: SearchFacets
    SearchProgram:
      properties:
        compiler:
          type: string
          enum:
          - rules
          - llm
          - llm_fallback
          - llm_abstained
          - catalog_fallback
          - task_rules
          - llm_paraphrase
          - llm_rewrite
          - llm_semantic
          title: Compiler
        purpose:
          type: string
          enum:
          - WORDS
          - BACKUP
          - WEBINAR
          - REMOTE_ACCESS
          - ANTIVIRUS
          - SERVER
          - SERVER_SOFTWARE
          - PRINTER
          - OCR
          - VIDEO_EDITOR
          - PHOTO_EDITOR
          - VIRTUALIZATION
          - ARCHIVER
          - UPS
          - SWITCH
          - MONITOR
          - UNKNOWN
          title: Purpose
        additional_purposes:
          items:
            type: string
            enum:
            - WORDS
            - BACKUP
            - WEBINAR
            - REMOTE_ACCESS
            - ANTIVIRUS
            - SERVER
            - SERVER_SOFTWARE
            - PRINTER
            - OCR
            - VIDEO_EDITOR
            - PHOTO_EDITOR
            - VIRTUALIZATION
            - ARCHIVER
            - UPS
            - SWITCH
            - MONITOR
            - UNKNOWN
          type: array
          maxItems: 1
          title: Additional Purposes
        join:
          type: string
          enum:
          - all
          - any
          title: Join
        terms:
          type: string
          title: Terms
        excluded_versions:
          items:
            type: string
          type: array
          title: Excluded Versions
        excluded_licenses:
          items:
            type: string
            enum:
            - new
            - renewal
            - upgrade
          type: array
          title: Excluded Licenses
      additionalProperties: false
      type: object
      required:
      - compiler
      - purpose
      - additional_purposes
      - join
      - terms
      - excluded_versions
      - excluded_licenses
      title: SearchProgram
    SearchRequest:
      properties:
        q:
          type: string
          minLength: 1
          pattern: \S
          title: Q
          description: Исходная строка покупателя, в том числе префикс при выборе подсказки.
        session_id:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          title: Session Id
          description: Анонимный ID сессии для контекста и последующей атрибуции.
        context:
          anyOf:
          - $ref: '#/components/schemas/Context'
          - type: 'null'
        filters:
          $ref: '#/components/schemas/Filters'
        selected_target:
          anyOf:
          - $ref: '#/components/schemas/SelectedTarget'
          - type: 'null'
          description: Выбранная подсказка. Сервер проверяет её ID и тип в текущем снимке.
        strategy:
          type: string
          enum:
          - standard
          - llm
          title: Strategy
          description: llm запрашивает интерпретацию намерения. Явные фильтры всегда обязательны.
          default: standard
        assistant_history:
          anyOf:
          - items:
              $ref: '#/components/schemas/AssistantTurn'
            type: array
            maxItems: 8
          - type: 'null'
          title: Assistant History
          description: Предыдущие сообщения чата от старых к новым. Текущий вопрос находится в q.
        sort:
          type: string
          enum:
          - relevance
          - price_asc
          - price_desc
          title: Sort
          description: Порядок прямых результатов. Точный SKU сохраняет приоритет, товары без цены идут в конце.
          default: relevance
        limit:
          type: integer
          maximum: 50.0
          minimum: 4.0
          title: Limit
          description: Размер основного списка вместе с more_results. Первые четыре места всегда находятся в top4.
          default: 4
      additionalProperties: false
      type: object
      required:
      - q
      title: SearchRequest
    SearchResponse:
      properties:
        program:
          anyOf:
          - $ref: '#/components/schemas/SearchProgram'
          - type: 'null'
          description: Исполненная программа и исключения по SKU.
        search_id:
          type: string
          minLength: 1
          pattern: \S
          title: Search Id
          description: ID этого поиска, включая поиск с пустым результатом.
        index_version:
          type: string
          minLength: 1
          pattern: \S
          title: Index Version
          description: Версия снимка каталога и поискового индекса.
        mode:
          type: string
          enum:
          - lexical
          - hybrid
          title: Mode
          description: Фактически использованный режим. При отказе энкодера применяется lexical.
        normalized_q:
          type: string
          title: Normalized Q
        applied_filters:
          $ref: '#/components/schemas/Filters'
          description: Ограничения, фактически применённые к SKU после разбора запроса.
        primary_target:
          anyOf:
          - $ref: '#/components/schemas/Target'
          - type: 'null'
          description: Переход к SKU, семейству, вендору, категории или подборке. Учитывается отдельно от товарных
            мест.
        direct_count:
          type: integer
          minimum: 0.0
          title: Direct Count
          description: Число различных прямых семейств после фильтров и выбора очереди цены, до обрезки по limit.
        top4:
          items:
            oneOf:
            - $ref: '#/components/schemas/DirectCard'
            - $ref: '#/components/schemas/ComplementCard'
            discriminator:
              propertyName: role
              mapping:
                complement: '#/components/schemas/ComplementCard'
                direct: '#/components/schemas/DirectCard'
          type: array
          maxItems: 4
          title: Top4
          description: Порядок отображения. Сначала прямые семейства, затем подтверждённые дополнения. Все family_key
            различны.
        more_results:
          items:
            $ref: '#/components/schemas/DirectCard'
          type: array
          title: More Results
          description: Дополнительные прямые семейства сверх первой четвёрки, до общего limit.
        alternatives:
          items:
            $ref: '#/components/schemas/AlternativeCard'
          type: array
          title: Alternatives
          description: Отдельный блок функциональных замен ниже основной выдачи.
        shortfall_reason:
          anyOf:
          - type: string
            enum:
            - NO_DIRECT_MATCH
            - NOT_ENOUGH_VERIFIED_FAMILIES
          - type: 'null'
          title: Shortfall Reason
          description: null при полной четвёрке. При нуле прямых совпадений — NO_DIRECT_MATCH, при недоборе проверенных
            семейств — NOT_ENOUGH_VERIFIED_FAMILIES.
        facets:
          anyOf:
          - $ref: '#/components/schemas/SearchFacets'
          - type: 'null'
          description: Варианты фильтров по прямым совпадениям. Для каждой группы учитывать все явные ограничения,
            кроме собственного фильтра.
        llm_applied:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Llm Applied
          description: true, когда интерпретация LLM участвовала в поиске, false при деградации.
        assistant_message:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
            pattern: \S
          - type: 'null'
          title: Assistant Message
          description: Ответ чата на основе найденных сведений или уточняющий вопрос.
      additionalProperties: false
      type: object
      required:
      - search_id
      - index_version
      - mode
      - normalized_q
      - applied_filters
      - primary_target
      - direct_count
      - top4
      - more_results
      - alternatives
      - shortfall_reason
      title: SearchResponse
    SelectedTarget:
      properties:
        kind:
          type: string
          enum:
          - offer
          - family
          - vendor
          - category
          - collection
          title: Kind
        target_id:
          type: string
          minLength: 1
          pattern: \S
          title: Target Id
          description: Строковый ID из ответа /v1/suggest, в пространстве выбранного kind.
      additionalProperties: false
      type: object
      required:
      - kind
      - target_id
      title: SelectedTarget
    Suggestion:
      properties:
        kind:
          type: string
          enum:
          - offer
          - family
          - vendor
          - category
          - collection
          title: Kind
        target_id:
          type: string
          minLength: 1
          pattern: \S
          title: Target Id
          description: Строковый ID из ответа /v1/suggest, в пространстве выбранного kind.
        label:
          type: string
          minLength: 1
          pattern: \S
          title: Label
      additionalProperties: false
      type: object
      required:
      - kind
      - target_id
      - label
      title: Suggestion
    Target:
      properties:
        kind:
          type: string
          enum:
          - offer
          - family
          - vendor
          - category
          - collection
          title: Kind
        id:
          type: string
          minLength: 1
          pattern: \S
          title: Id
          description: ID сущности в её пространстве kind.
        url:
          type: string
          pattern: ^(https?://|/)
          title: Url
          description: Абсолютный HTTP(S) URL или путь от корня витрины.
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      - url
      title: Target
    Problem:
      additionalProperties: false
      description: Ошибка в формате Problem Details. Клиент разбирает стабильный code.
      properties:
        type:
          default: about:blank
          title: Type
          type: string
        title:
          title: Title
          type: string
        status:
          title: Status
          type: integer
        detail:
          title: Detail
          type: string
        code:
          title: Code
          type: string
      required:
      - title
      - status
      - detail
      - code
      title: Problem
      type: object
tags:
- name: Поиск
  description: Отбор семейств, ранжирование и подсказки.
- name: Каталог
  description: Навигация и варианты конкретного товара.
- name: Аналитика
  description: Доставка событий и агрегаты по сессиям.
- name: Состояние
  description: Доступность публичного сервиса и его зависимостей.
