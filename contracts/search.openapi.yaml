  /v1/events:
    post:
      tags:
      - Аналитика
      summary: Записать события сессии
      description: 'Весь пакет проверяется и записывается в одной транзакции. При повторной доставке event_id

        сохраняется первая запись. Сервер создаёт событие search самостоятельно. Для товарного клика,

        корзины и позиции заказа передавайте фактический offer_id. У навигации передавайте тип и ID цели.


        Каждая купленная позиция получает отдельный event_id. Сервер привязывает её к последнему предшествующему

        клику по тому же offer_id в той же сессии. Заказ без такого клика сохраняется с search_id=null.'
      operationId: recordEvents
      requestBody:
        content:
          application/json:
            schema:
              items:
                anyOf:
                - $ref: '#/components/schemas/Impression'
                - $ref: '#/components/schemas/CardClick'
                - $ref: '#/components/schemas/DetailClick'
                - $ref: '#/components/schemas/NavigationClick'
                - $ref: '#/components/schemas/Reformulation'
                - $ref: '#/components/schemas/AddToCart'
                - $ref: '#/components/schemas/OrderLine'
              type: array
              minItems: 1
              title: Events
            examples:
              order:
                summary: Клик и покупка того же SKU
                value:
                - type: click
                  event_id: evt-click-1
                  session_id: demo-session-1
                  ts: '2026-11-26T10:05:00+03:00'
                  search_id: example-search-1
                  offer_id: '473582'
                  family_key: family/391338
                  role: direct
                  block: top4
                  position: 1
                - type: order
                  event_id: evt-order-line-1
                  session_id: demo-session-1
                  ts: '2026-11-26T10:12:00+03:00'
                  offer_id: '473582'
              navigation:
                summary: Клик по вендору и переформулировка
                value:
                - type: click
                  event_id: evt-nav-1
                  session_id: demo-session-1
                  ts: '2026-11-26T10:15:00+03:00'
                  search_id: search-mts
                  block: navigation
                  target_kind: vendor
                  target_id: webinar
                - type: reformulation
                  event_id: evt-edit-1
                  session_id: demo-session-1
                  ts: '2026-11-26T10:16:00+03:00'
                  search_id: search-mts
                  next_search_id: search-mts-standard
        required: true
      responses:
        '204':
          description: Пакет зафиксирован, тело ответа пустое.
        default:
          description: Другие ошибки используют тот же формат Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Справочный стенд
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONTRACT_ONLY:
                  value:
                    type: about:blank
                    title: Справочный стенд
                    status: 501
                    detail: Формат запроса принят. Обработчик реализуется в Spring Boot.
                    code: CONTRACT_ONLY
        '400':
          description: Ошибка входных данных
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: about:blank
                    title: Ошибка входных данных
                    status: 400
                    detail: Проверьте типы полей и ограничения запроса.
                    code: INVALID_REQUEST
        '503':
          description: Журнал недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                EVENT_STORE_UNAVAILABLE:
                  value:
                    type: about:blank
                    title: Журнал недоступен
                    status: 503
                    detail: Запись временно недоступна.
                    code: EVENT_STORE_UNAVAILABLE
  /v1/analytics:
    get:
      tags:
      - Аналитика
      summary: Получить показатели поиска
      description: 'Период [from, to) задаётся временем RFC 3339 с часовым поясом.

        Нулевая выдача означает direct_count=0. Уход учитывается для завершённой неуспешной сессии после

        30 минут бездействия. В конверсии сессия с атрибутированным заказом учитывается один раз.

        При нулевом знаменателе value=null.'
      operationId: getSearchAnalytics
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Включительная нижняя граница периода.
          title: From
        description: Включительная нижняя граница периода.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Исключительная верхняя граница периода.
          title: To
        description: Исключительная верхняя граница периода.
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - demo
            - seed
            type: string
          - type: 'null'
          description: Фильтр происхождения событий.
          title: Source
        description: Фильтр происхождения событий.
      - name: index_version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            pattern: \S
          - type: 'null'
          description: Версия индекса, записанная вместе с поиском.
          title: Index Version
        description: Версия индекса, записанная вместе с поиском.
      responses:
        '200':
          description: Агрегаты, числители, знаменатели и причины неудач.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
              examples:
                seed:
                  summary: Синтетический период
                  value:
                    period:
                      from: '2026-11-26T00:00:00+03:00'
                      to: '2026-11-27T00:00:00+03:00'
                      source: seed
                    zero_result_rate:
                      numerator: 2
                      denominator: 10
                      value: 0.2
                    abandonment_rate:
                      numerator: 1
                      denominator: 2
                      value: 0.5
                    conversion_rate:
                      numerator: 1
                      denominator: 5
                      value: 0.2
                    failures:
                    - reason: missing_synonym
                      count: 1
                      query_examples:
                      - мдаемон
                      action: Проверить написание в каталоге и добавить подтверждённый синоним.
        default:
          description: Другие ошибки используют тот же формат Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Справочный стенд
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONTRACT_ONLY:
                  value:
                    type: about:blank
                    title: Справочный стенд
                    status: 501
                    detail: Формат запроса принят. Обработчик реализуется в Spring Boot.
                    code: CONTRACT_ONLY
        '400':
          description: Ошибка входных данных
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: about:blank
                    title: Ошибка входных данных
                    status: 400
                    detail: Проверьте типы полей и ограничения запроса.
                    code: INVALID_REQUEST
        '503':
          description: Журнал недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                EVENT_STORE_UNAVAILABLE:
                  value:
                    type: about:blank
                    title: Журнал недоступен
                    status: 503
                    detail: Статистика временно недоступна.
                    code: EVENT_STORE_UNAVAILABLE
  /health:
    get:
      tags:
      - Состояние
      summary: Получить состояние Spring Boot
      description: 'На рабочем Spring Boot этот маршрут уже доступен. На справочном стенде показывается его контракт.

        Поля состояния индекса и семантики появятся при подключении этих компонентов.'
      operationId: getSearchHealth
      responses:
        '200':
          description: Доступность HTTP-приложения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHealth'
              examples:
                bootstrap:
                  summary: Существующий ответ Spring Boot
                  value:
                    status: up
                    model_service: unavailable
                indexed:
                  summary: После подключения каталога
                  value:
                    status: up
                    model_service: up
                    index_version: 2026-11-25T14:12
                    search_ready: true
                    semantic_ready: true
        default:
          description: Другие ошибки используют тот же формат Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Справочный стенд
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONTRACT_ONLY:
                  value:
                    type: about:blank
                    title: Справочный стенд
                    status: 501
                    detail: Формат запроса принят. Обработчик реализуется в Spring Boot.
                    code: CONTRACT_ONLY
