openapi: 3.1.0
info:
  title: Умный поиск Softline · публичный API
  description: 'Контракт витрины, поиска и аналитики для реализации в Spring Boot. Разверните операцию, чтобы посмотреть
    схему и именованные примеры в **Responses**. На этом справочном стенде **Try it out** проверяет входные данные.
    Корректный вызов возвращает **501 CONTRACT_ONLY**, ошибка формата — **400 INVALID_REQUEST**. Живой публичный
    сервис принимает запросы на порту 8080.


    [Swagger энкодера](/model/docs) · [ReDoc поиска](/redoc)'
  version: 1.0.0
paths:
  /v1/search:
    post:
      tags:
      - Поиск
      summary: Найти товары
      description: 'Точный артикул и явные фильтры имеют приоритет над контекстом. Все ограничения лицензии должны

        совпасть у одного SKU. В top4 каждое семейство занимает одно место. Дополнение содержит ID опорного

        предложения и положительные проверки. Навигация и функциональные аналоги выводятся отдельно.


        Отсутствие совпадений даёт 200 и пустой top4. При недоступности модели поиск переходит в lexical.

        Сервер регистрирует отправленный поиск один раз и возвращает search_id.'
      operationId: searchProducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              sku:
                summary: Точный артикул
                value:
                  q: EP2-06605
                  session_id: demo-session-1
              selected:
                summary: Выбор подсказки по префиксу
                value:
                  q: EP2-0
                  selected_target:
                    kind: offer
                    target_id: '473582'
              context:
                summary: Неоднозначный запрос с B2B-контекстом
                value:
                  q: сервер
                  context:
                    segment: b2b
                    profile_id: hardware-buyer
              license:
                summary: Ограничения одной лицензии
                value:
                  q: КриптоПро CSP
                  filters:
                    version: '5.0'
                    license_type: renewal
                    device_count: 5
                    term_months: 12
                    available_only: true
              task:
                summary: Поиск по задаче
                value:
                  q: Как восстановить файлы после сбоя?
                  limit: 10
              pantum:
                summary: Два устройства и два дополнения
                value:
                  q: Покажи устройства Pantum P2500W или BM1800W
              backup:
                summary: Поиск подборки по названию
                value:
                  q: кибер бэкап
              selected_backup:
                summary: Выбор подборки по префиксу
                value:
                  q: кибер бэ
                  selected_target:
                    kind: collection
                    target_id: cyberprotect-1033
              mts:
                summary: Навигация к вендору
                value:
                  q: мтс
              analog:
                summary: Отсутствующая модель с известным назначением
                value:
                  q: Нужен монохромный лазерный принтер A4 Pantum P2507
              absent:
                summary: Пустая выдача
                value:
                  q: несуществующая-модель-000
        required: true
      responses:
        '200':
          description: Список в порядке показа, включая пустой результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                sku:
                  summary: Office, цена 36 584 ₽, один прямой SKU
                  value:
                    search_id: example-search-1
                    index_version: 2026-11-25T14:12
                    mode: lexical
                    normalized_q: ep2-06605
                    applied_filters: {}
