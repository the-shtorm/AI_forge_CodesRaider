openapi: 3.1.0
info:
  title: Умный поиск Softline · энкодер
  description: Внутренний API для Spring Boot. GET /health проверяет HTTP-процесс. После загрузки и прогрева CPU-модели
    GET /ready возвращает profile_id для POST /internal/v1/embeddings. На отдельном справочном стенде модель отключена.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Состояние
      summary: Проверить HTTP-процесс
      description: Используется Docker Compose и Spring Boot для проверки связи с FastAPI.
      operationId: getEncoderHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelHealth'
  /ready:
    get:
      tags:
      - Состояние
      summary: Узнать профиль прогретого энкодера
      description: 'При импорте Java сохраняет profile_id в манифест снимка. Профиль фиксирует модель,

        SHA весов, токенизацию, префиксы, pooling, размерность и нормализацию.'
      operationId: getEncoderReadiness
      responses:
        '200':
          description: Энкодер прогрет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              example:
                ready: true
                profile_id: e5-0f240d7cdf436ba4c4671abe97ae2b8cbbb5702a233fd334def019c5e0cb227d
                dimension: 384
        '503':
          description: Профиль ещё недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MODEL_NOT_READY:
                  value:
                    type: about:blank
                    title: Профиль ещё недоступен
                    status: 503
                    detail: Модель ещё не прогрета.
                    code: MODEL_NOT_READY
  /internal/v1/embeddings:
    post:
      tags:
      - Эмбеддинги
      summary: Закодировать запрос или пакет карточек
      description: 'Передавайте текст без служебного префикса. Энкодер добавляет query: или passage: один раз,

        ограничивает вход 512 токенами и выдаёт 384 конечных числа для каждого текста.

        При отказе энкодера публичный поиск использует лексический режим.'
      operationId: encodeTexts
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/QueryBatch'
              - $ref: '#/components/schemas/PassageBatch'
              title: Body
              discriminator:
                propertyName: input_type
                mapping:
                  query: '#/components/schemas/QueryBatch'
                  passage: '#/components/schemas/PassageBatch'
            examples:
              query:
                summary: Один запрос витрины
                value:
                  input_type: query
                  profile_id: e5-0f240d7cdf436ba4c4671abe97ae2b8cbbb5702a233fd334def019c5e0cb227d
                  texts:
                  - Как восстановить файлы после сбоя?
              passage:
                summary: Пакет при импорте
                value:
                  input_type: passage
                  profile_id: e5-0f240d7cdf436ba4c4671abe97ae2b8cbbb5702a233fd334def019c5e0cb227d
                  texts:
                  - Средства резервного копирования
                  - Операционные системы
        required: true
      responses:
        '200':
          description: Векторы в порядке входных текстов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Embeddings'
              examples:
                unit:
                  summary: Синтетический единичный вектор для проверки формата
                  value:
                    profile_id: e5-0f240d7cdf436ba4c4671abe97ae2b8cbbb5702a233fd334def019c5e0cb227d
                    dimension: 384
                    vectors:
                    - - 1.0
