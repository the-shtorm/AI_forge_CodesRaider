        '409':
          description: Профили различаются
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                PROFILE_MISMATCH:
                  value:
                    type: about:blank
                    title: Профили различаются
                    status: 409
                    detail: Профиль запроса отличается от активного.
                    code: PROFILE_MISMATCH
        '422':
          description: Ошибка входных данных
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: about:blank
                    title: Ошибка входных данных
                    status: 422
                    detail: Для query нужен ровно один непустой текст.
                    code: INVALID_REQUEST
        '503':
          description: Энкодер временно недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MODEL_NOT_READY:
                  value:
                    type: about:blank
                    title: Энкодер временно недоступен
                    status: 503
                    detail: Модель ещё не прогрета.
                    code: MODEL_NOT_READY
                MODEL_BUSY:
                  value:
                    type: about:blank
                    title: Энкодер временно недоступен
                    status: 503
                    detail: Очередь заполнена.
                    code: MODEL_BUSY
                INVALID_MODEL_OUTPUT:
                  value:
                    type: about:blank
                    title: Энкодер временно недоступен
                    status: 503
                    detail: Энкодер вернул некорректные векторы.
                    code: INVALID_MODEL_OUTPUT
                INFERENCE_FAILED:
                  value:
                    type: about:blank
                    title: Энкодер временно недоступен
                    status: 503
                    detail: Энкодер не смог завершить вычисление.
                    code: INFERENCE_FAILED
components:
  schemas:
    Embeddings:
      properties:
        profile_id:
          type: string
          minLength: 1
          pattern: \S
          title: Profile Id
        dimension:
          type: integer
          const: 384
          title: Dimension
        vectors:
          items:
            items:
              type: number
            type: array
            maxItems: 384
            minItems: 384
          type: array
          maxItems: 32
          minItems: 1
          title: Vectors
          description: Один L2-нормализованный вектор на каждый входной текст в исходном порядке.
      additionalProperties: false
      type: object
      required:
      - profile_id
      - dimension
      - vectors
      title: Embeddings
    ModelHealth:
      properties:
        status:
          type: string
          const: up
          title: Status
      additionalProperties: false
      type: object
      required:
      - status
      title: ModelHealth
    PassageBatch:
      properties:
        input_type:
          type: string
          const: passage
          title: Input Type
        profile_id:
          type: string
          minLength: 1
          pattern: \S
          title: Profile Id
        texts:
          items:
            type: string
            minLength: 1
            pattern: \S
          type: array
          maxItems: 32
          minItems: 1
          title: Texts
      additionalProperties: false
      type: object
      required:
      - input_type
      - profile_id
      - texts
      title: PassageBatch
    QueryBatch:
      properties:
        input_type:
          type: string
          const: query
          title: Input Type
        profile_id:
          type: string
          minLength: 1
          pattern: \S
          title: Profile Id
        texts:
          items:
            type: string
            minLength: 1
            pattern: \S
          type: array
          maxItems: 1
          minItems: 1
          title: Texts
      additionalProperties: false
      type: object
      required:
      - input_type
      - profile_id
      - texts
      title: QueryBatch
    Ready:
      properties:
        ready:
          type: boolean
          const: true
          title: Ready
        profile_id:
          type: string
          minLength: 1
          pattern: \S
          title: Profile Id
          description: ID профиля после загрузки и прогрева.
        dimension:
          type: integer
          const: 384
          title: Dimension
      additionalProperties: false
      type: object
      required:
      - ready
      - profile_id
      - dimension
      title: Ready
    Problem:
      additionalProperties: false
      description: Ошибка в формате Problem Details. Клиент разбирает стабильный code.
      properties:
        type:
          default: about:blank
          title: Type
          type: string
        title:
          title: Title
          type: string
        status:
          title: Status
          type: integer
        detail:
          title: Detail
          type: string
        code:
          title: Code
          type: string
      required:
      - title
      - status
      - detail
      - code
      title: Problem
      type: object
tags:
- name: Состояние
- name: Эмбеддинги
