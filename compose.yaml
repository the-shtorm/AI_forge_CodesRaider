services:
  app:
    build:
      context: .
      target: app
    environment:
      MODEL_BASE_URL: http://model:8000
      SNAPSHOTS_DIR: /data/snapshots
      CATALOG_PATH: /input/catalog.xml
      EVENTS_DB: /data/events/events.db
      SEMANTIC_MODE: ${SEMANTIC_MODE:-auto}
    volumes:
      - search-data:/data
      - search-events:/data/events
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      model:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  model:
    profiles: [ml, dev]
    build:
      context: ./model
      target: model
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 8

  api-docs:
    profiles: [docs]
    build:
      context: ./model
      target: docs
    command: ["uvicorn", "search_contract.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_DOCS_PORT:-8001}:8000"

  frontend:
    profiles: [dev]
    build:
      context: .
      target: frontend-dev
    environment:
      SPRING_BASE_URL: http://app:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/workspace/frontend/src:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 8

volumes:
  search-data:
  search-events:
